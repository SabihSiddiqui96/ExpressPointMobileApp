trigger:
- master

pool:
  name: PrimeroEdge
  demands:
    - Agent.Name -equals Agent-2

variables:
  IONIC_CLI_VERSION: '5.4.16'
  CORDOVA_CLI_VERSION: '12.0.0'
  ANDROID_SDK_VERSION: '34.0.0'
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'
  ANDROID_SDK_API_LEVEL: 'android-34'

steps:
  # Use Node.js 20.x
  - task: NodeTool@0
    inputs:
      versionSpec: '20.11.1'
      checkLatest: true
    displayName: 'Use Node.js 20.x'

  # Install Ionic and Cordova CLI globally
  - script: npm install -g ionic@$(IONIC_CLI_VERSION) cordova@$(CORDOVA_CLI_VERSION)
    displayName: 'Install Ionic and Cordova CLI'

  # Install npm packages
  - task: Npm@0
    inputs:
      command: 'install'
      arguments: '-D -E @angular/cli'
    displayName: 'Install npm packages'

  # Add Android platform
  - script: |
      ionic cordova platform add android
    displayName: 'Add Android platform'

  # Build Android APK
  - script: |
      ionic cordova build android --prod --release
    displayName: 'Build Android APK'

  - task: CopyFiles@2
    name: CopyAPK
    displayName: 'Copy APK file to JAVA Path'
    inputs:
      SourceFolder: $(Build.SourcesDirectory)/platforms/android/app/build/outputs/bundle/release
      Contents: app-release.aab
      TargetFolder: C:\Program Files\Java\jdk-17\bin
      OverWrite: true

  - script: |
     cd "C:\Program Files\Java\jdk-17\bin"
      jarsigner -verbose -keystore $(KEYSTORE_PATH) -keypass $(KEY_PASSWORD) -storepass $(KEYSTORE_PASSWORD) app-release.aab $(KEY_ALIAS)
    displayName: 'Sign the APK/AAB'

  # Publish APK as artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'C:\Program Files\Java\jdk-17\bin\app-release.aab'
      ArtifactName: 'android-aab'
      publishLocation: 'Container'
    displayName: 'Publish APK Artifact'
