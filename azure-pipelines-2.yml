trigger:
  branches:
    include:
      - master  # Or the branch you want to trigger on

pool:
  vmImage: 'windows-latest'  # Or 'macos-latest' if you're using a Mac agent

variables:
  IONIC_CLI_VERSION: '5.4.16'
  CORDOVA_CLI_VERSION: '12.0.0'
  JDK_DOWNLOAD_URL: 'https://download.java.net/openjdk/jdk11/ri/openjdk-11.0.11_windows-x64_bin.zip'

steps:
  - task: UseNode@1
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node.js 20.x'

  - script: |
      SET JAVA_INSTALLED=false
      SET JAVA_VERSION=""

      REM Check if Java is installed and get the version
      for /f "tokens=*" %%a in ('java -version 2^>^&1') do (
          echo %%a
          SET JAVA_VERSION=%%a
      )

      REM Check if JDK 11 is installed (looking for "11" in the version string)
      echo %JAVA_VERSION% | findstr /i "11" >nul
      if %ERRORLEVEL% NEQ 0 (
          SET JAVA_INSTALLED=false
      ) else (
          SET JAVA_INSTALLED=true
      )

      REM If JDK 11 is not installed, download and install manually
      if "%JAVA_INSTALLED%"=="false" (
          echo JDK 11 is not installed. Downloading and installing...

          REM Download OpenJDK using PowerShell
          powershell -Command "Try {Invoke-WebRequest -Uri '%JDK_DOWNLOAD_URL%' -OutFile 'openjdk-11.zip' -ErrorAction Stop} Catch {Write-Host 'Error downloading JDK: $_'; exit 1}"

          REM Extract OpenJDK to a specific directory
          powershell -Command "Try {Expand-Archive -Path 'openjdk-11.zip' -DestinationPath 'C:\OpenJDK' -ErrorAction Stop} Catch {Write-Host 'Error extracting JDK: $_'; exit 1}"

          REM Set JAVA_HOME and update PATH for current session
          setx JAVA_HOME "C:\OpenJDK\jdk-11.0.11"
          setx PATH "%PATH%;C:\OpenJDK\jdk-11.0.11\bin"
      ) else (
          echo JDK 11 is already installed.
      )
    displayName: 'Check and Install JDK 11'
    condition: eq(variables['Agent.OS'], 'Windows_NT')


  - script: npm install -g ionic@$(IONIC_CLI_VERSION) cordova@$(CORDOVA_CLI_VERSION)
    displayName: 'Install Ionic and Cordova CLI'

  - task: Npm@0
    inputs:
      command: 'install'
      arguments: '-D -E @angular/cli'
    displayName: 'Install npm packages'

  - task: CmdLine@2
    inputs:
      script: 'ionic build'
    displayName: 'Ionic Build'

  - script: |
      ionic cordova platform add android
    displayName: 'Add Android platform'

  - script: |
      ionic cordova build android --prod --release
    displayName: 'Build Android APK'

  # Sign the APK
  - script: |
      jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore $ANDROID_KEYSTORE_PATH \
      -storepass $ANDROID_KEYSTORE_PASSWORD -keypass $ANDROID_KEY_PASSWORD \
      platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk $ANDROID_KEY_ALIAS
    displayName: 'Sign the APK'
    env:
      ANDROID_KEYSTORE_PATH: $(ANDROID_KEYSTORE_PATH)  # Secure file or pipeline variable
      ANDROID_KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      ANDROID_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)
      ANDROID_KEY_ALIAS: $(ANDROID_KEY_ALIAS)

  # Zipalign the APK
  - script: |
      $ANDROID_SDK_ROOT/build-tools/30.0.3/zipalign -v 4 platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk platforms/android/app/build/outputs/apk/release/app-release-signed.apk
    displayName: 'Align APK'

  # Publish APK as artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'platforms/android/app/build/outputs/apk/release/app-release-signed.apk'
      ArtifactName: 'android-apk'
      publishLocation: 'Container'
    displayName: 'Publish APK Artifact'
