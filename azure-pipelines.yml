trigger:
- develop

variables:
  BuildNumberFormat: '$(BuildDefinitionName)_$(ReleaseNumber).$(SprintNumber).$(HotfixNumber).$(Date:MMdd)$(Rev:r)'

pool:
  name: PrimeroEdge
  agent:
    name: Agent

steps:
- checkout: self
  fetchDepth: 1

- task: NodeTool@0
  inputs:
    versionSpec: '10.9'
    checkLatest: true

- task: Npm@0
  inputs:
    command: 'install'
    arguments: 'ionic -g'

- task: Npm@1
  inputs:
    command: 'custom'
    customCommand: 'install cordova@10.0.0 -g'


- task: CmdLine@2
  inputs:
    script: 'ionic cordova build android'

- task: Npm@0
  inputs:
    command: 'custom'
    arguments: 'i -D -E @angular/cli'

- task: CmdLine@2
  inputs:
    script: 'ionic cordova build'

- task: Npm@0
  inputs:
    cwd: 'electron'
    command: 'install'
    arguments: '-prod'

- task: NuGetCommand@2
  inputs:
    command: 'restore'
    restoreSolution: 'electron/ExpressPointPeripherals/ExpressPointPeripherals.sln'
    feedsToUse: 'config'

- task: VSBuild@1
  inputs:
    solution: 'electron/ExpressPointPeripherals/ExpressPointPeripherals.sln'
    platform: '$(BuildPlatform)'

- task: CopyFiles@2
  name: CopyFiles_5
  displayName: 'Copy Files to: $(build.sourcesDirectory)\electron-windows\app'
  inputs:
    SourceFolder: '$(build.sourcesDirectory)\electron/ExpressPointPeripherals/bin/Release'
    Contents: '**'
    TargetFolder: '$(build.sourcesDirectory)\electron\Peripherals'
    OverWrite: true

- task: Npm@0
  inputs:
    cwd: 'electron'
    command: 'install'
    arguments: 'yarn'

- task: Npm@0
  name: NpmInstall_7
  displayName: 'package-win'
  inputs:
    cwd: 'electron'
    command: 'run'
    arguments: 'build'

- task: CopyFiles@2
  name: CopyFiles_9
  displayName: 'Copy files to: $(build.artifactstagingdirectory)'
  inputs:
    SourceFolder: 'electron\dist'
    Contents: '**'
    TargetFolder: '\\QAPEWS02\ExpressPointNSIS2\DevelopBranch'
