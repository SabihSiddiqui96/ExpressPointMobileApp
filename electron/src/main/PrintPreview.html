<!DOCTYPE html>
<html lang="en">

<head>
    <title>Print Preview</title>
</head>
<style>
    .receiptContent {
        font-family: Arial, Helvetica, sans-serif;
        font-style: normal;
        font-size: 7pt;
        margin-left: 0px
    }
</style>

<body>
    <div id="main-div" class="receiptContent"></div>
    <div id="receipt-copy" class="receiptContent"></div>
    <script>
        var ipcRenderer = require('electron').ipcRenderer;
        var body = document.getElementById('main-div');
        var receiptCopyDiv = document.getElementById('receipt-copy');
        var separator = '<div class="receiptContent"><p>-----------------------------------</p></div>';

        ipcRenderer.on('print-text', function (event, arg) {
            var content = arg.data[0]['html'];
            body.insertAdjacentHTML('afterbegin', content);

            if (arg.copies == 2) { // If ESRR setting is set to Yes, print 2 copies of receipts
                receiptCopyDiv.insertAdjacentHTML('afterbegin', separator);
                receiptCopyDiv.insertAdjacentHTML('beforeend', content);
            }
            event.sender.send('print-text-reply', arg);
        });
    </script>
</body>

</html>
