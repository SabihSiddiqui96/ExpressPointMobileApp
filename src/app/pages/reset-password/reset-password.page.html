<ion-row vh100 class="ion-justify-content-center" bg-theme #resetPasswordViewRoot>
  <ion-col size="10" size-md="6" size-xl="4" [ngClass]="{'login-box': !keyboardVisible}">
    <div box-white class="ion-margin-horizontal">
      <img src='assets/img/expresspoint-logo-dark.svg' class="ion-margin-bottom">
      <div class="fusion-row" class="ion-justify-content-center">
        <div class="fusion-copyright-content">
          <div class="fusion-copyright-notice">
            <strong>Welcome to Expresspoint. You are required to change your password at this time. Please enter and
              confirm
              your new password.</strong>
          </div>
        </div>
      </div>

      <!-- Non-iOS -->
      <!-- <ion-list mode="ios" inset *ngIf="!isIOS"> -->
      <ion-list mode="ios" inset>
        <ion-item mode="ios" class="no-line">
          <ion-icon slot="start" name="lock" color="slate"></ion-icon>
          <ion-input [type]="newPasswordType" placeholder="New Password" custom-tb #input1
            (keyup)="focusInput($event,null)" autocorrect="off" [(ngModel)]="resetPassword.newPassword"
            autocapitalize="none"></ion-input>
          <ion-button fill="clear" color="slate" class="eye-icon" style="height:32px;z-index: 9;"
            (click)='hideShowNewPassword()'>
            <ion-icon slot="end" [name]="newPasswordIcon" style="font-size:32px;"></ion-icon>
          </ion-button>
        </ion-item>
        <ion-item mode="ios" class="no-line ion-align-items-center">
          <ion-icon slot="start" name="lock" color="slate"></ion-icon>
          <ion-input [type]="confirmPasswordType" placeholder="Confirm Password" custom-tb #input2
            (keyup)="focusInput($event,null)" autocorrect="off" [(ngModel)]="resetPassword.confirmPassword"
            autocapitalize="none"></ion-input>
          <ion-button fill="clear" color="slate" class="eye-icon" style="height:32px;z-index: 9;"
            (click)='hideShowConfirmPassword()'>
            <ion-icon slot="end" [name]="confirmPasswordIcon" style="font-size:32px;"></ion-icon>
          </ion-button>
        </ion-item>

      </ion-list>
      <!-- Non-iOS -->
      <!-- iOS only -->
      <!-- <ion-list mode="ios" inset *ngIf="isIOS">
        <ion-icon slot="start" name="lock" color="slate"></ion-icon>

              (click)="iosHideShowConfirmPassword()">
            </ion-icon>
          </ion-button>
        </label>
      </ion-list> -->
      <!-- iOS only -->

      <ion-button expand="block" size="large" box-action color="slate" (click)="validatePassword()">
        Change Password
        <ion-icon slot="end" name="arrow-round-forward"></ion-icon>
      </ion-button>

      <ul>
        <li *ngFor="let pwdRestrictions of passwordSystemSettingsList" class="btn-red"
          [ngStyle]="{'color':pwdRestrictions.isFullFilled === true ? 'green' : 'red' }">
          {{pwdRestrictions.displayText}}
        </li>
      </ul>

    </div>
  </ion-col>

</ion-row>
<ion-footer *ngIf="!isNativeKeyboardOpen">
  <ion-buttons slot="secondary" *ngIf="versionNumber">
    <ion-label>Version {{versionNumber}}</ion-label>
  </ion-buttons>

  <div class="fusion-row" class="ion-justify-content-center">
    <div class="fusion-copyright-content">
      <div class="fusion-copyright-notice">
        <strong>&copy; {{copyRightYear}} PrimeroEdge | All Rights Reserved</strong>
      </div>
    </div>
  </div>
</ion-footer>
