<ion-header>
  <ion-toolbar>
    <ion-title class="text-large">
      Auto Serve Options
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content padding class="auto-serve-content" style="height:fit-content;">
  <ion-list>
    <ion-item lines="none" class="bg-transparent pad-top">
      <ion-label class="ion-text-left bold" position="bottom">Enable Auto-Serve</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoServeEnabled" (ionChange)="setAutoServeEnabled($event)">
      </ion-toggle>
    </ion-item>

    <ion-item *ngIf="autoServeEnabled" lines="none" class="bg-transparent item-padding">
      <ion-label class="ion-text-left" position="bottom">Auto-Serve Delay Before
        Charging</ion-label>
      <ion-select [(ngModel)]="autoServeDelay" (ionChange)="setAutoServeDelay($event)" aria-label="AutoServe Delay"
        interface="action-sheet">
        <ion-select-option value=0.5>0.5s</ion-select-option>
        <ion-select-option value=1>1s</ion-select-option>
        <ion-select-option value=2>2s</ion-select-option>
        <ion-select-option value=3>3s</ion-select-option>
        <ion-select-option value=4>4s</ion-select-option>
        <ion-select-option value=5>5s</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item *ngIf="autoServeEnabled" lines="none" class="bg-transparent pad-top">
      <ion-label class="ion-text-left bold" position="bottom">Enable Auto-Pause</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoPauseEnabled" (ionChange)="setAutoPauseEnabled($event)">
      </ion-toggle>
    </ion-item>
    <ion-item *ngIf="autoServeEnabled && autoPauseEnabled" lines="none" class="bg-transparent pause-padding">
      <ion-label class="ion-text-left" position="bottom">Pause Auto-Serve for Second Meal</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoPauseOptions.secondMeal" (ionChange)="setAutoPauseOptions($event)">
      </ion-toggle>
    </ion-item>
    <ion-item *ngIf="autoServeEnabled && autoPauseEnabled" lines="none" class="bg-transparent pause-padding">
      <ion-label class="ion-text-left" position="bottom">Pause Auto-Serve for Visiting Students</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoPauseOptions.visitingStudents"
        (ionChange)="setAutoPauseOptions($event)">
      </ion-toggle>
    </ion-item>
    <ion-item *ngIf="autoServeEnabled && autoPauseEnabled" lines="none" class="bg-transparent pause-padding">
      <ion-label class="ion-text-left" position="bottom">Pause Auto-Serve for Allergens & Special
        Instructions</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoPauseOptions.allergensAndNotes"
        (ionChange)="setAutoPauseOptions($event)">
      </ion-toggle>
    </ion-item>
    <ion-item *ngIf="autoServeEnabled && autoPauseEnabled" lines="none" class="bg-transparent pause-padding">
      <ion-label class="ion-text-left" position="bottom">Pause Auto-Serve for Menu Item Restrictions</ion-label>
      <ion-toggle color="slate" [(ngModel)]="autoPauseOptions.restrictions" (ionChange)="setAutoPauseOptions($event)">
      </ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
<ion-footer>
  <ion-toolbar class="center" color="white">
    <ion-button expand="block" size="large" fill="clear" color="slate" (click)="close()">
      Close
    </ion-button>
  </ion-toolbar>
</ion-footer>
