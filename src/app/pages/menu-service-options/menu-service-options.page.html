<ion-header>
  <ion-toolbar>
    <ion-title>
      Options
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-no-padding">
  <ion-list mode="ios" inset>
    <ion-item mode="ios" block clear icon-start (click)="goSwitchHands()">
      <ion-icon slot="start" name="repeat" color="slate"></ion-icon>
      <ion-label text-large>Switch Hands</ion-label>
    </ion-item>
    <ion-item mode="ios" block clear icon-start (click)="goToServicePage()">
      <ion-icon slot="start" name="arrow-round-back" color="slate"></ion-icon>
      <ion-label text-large>Go to Service Page</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" size="large" fill="clear" color="slate" (click)="close()">
      Close
    </ion-button>
  </ion-toolbar>
</ion-footer>
