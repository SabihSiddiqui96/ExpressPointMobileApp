<ion-header>
  <ion-toolbar>
    <ion-title>
      Cards
    </ion-title>
  </ion-toolbar>
  <ion-toolbar class="ion-no-padding" *ngIf="!hideChecks">
    <ion-row addbar padding>
      <ion-input type="text" placeholder="Card Number" maxlength="10" [(ngModel)]="cardNumber" input-outline>
      </ion-input>
      <ion-input type="text" placeholder="Card Amount" (keyup)="numberOnly($event)" maxlength="8"
        [(ngModel)]="cardAmount" input-outline></ion-input>
      <ion-button fill="clear" (click)="addCard()">
        <ion-icon slot="icon-only" name="add-circle" color="secondary"></ion-icon>
      </ion-button>
    </ion-row>
  </ion-toolbar>
</ion-header>
<ion-content padding>
  <div custom-list>
    <ion-row header-row>
      <ion-col size="3">
        <ion-label>Card #</ion-label>
      </ion-col>
      <ion-col size="3">
        <ion-label>Amount</ion-label>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let card of cardList; let i=index;" class="ion-align-items-center">
      <ion-col size="3">
        <ion-label *ngIf="!card.IsDeleted">{{card.CardNumber}}</ion-label>
      </ion-col>
      <ion-col size="3">
        <ion-label *ngIf="!card.IsDeleted">{{card.Amount | currency:'USD':true:'1.2-2'}}</ion-label>
      </ion-col>
      <ion-col size="2">
        <ion-button *ngIf="!card.IsDeleted && !hideChecks" expand="block" fill="clear" (click)="removeCard(i)">
          <ion-icon slot="icon-only" name="close-circle" color="danger"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-title *ngIf="cardList.length !=0">
      {{cardList.length}} cards totaling {{cardTotal | currency:'USD':true:'1.2-2'}}
    </ion-title>
    <ion-buttons slot="primary">
      <ion-button size="large" expand="block" fill="clear" color="secondary" (click)="dismiss()">

        Close
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
