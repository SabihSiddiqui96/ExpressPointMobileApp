<ion-header>
    <ion-toolbar>
        <ion-title class="ion-text-center">Closing POS Terminal</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
    <!-- Progress Bar -->
    <ion-progress-bar [value]="progress / 100" style="width: 100%;"></ion-progress-bar>

    <!-- Dynamic Status Message -->
    <p><strong>{{ currentStepMessage }}</strong></p>

    <!-- Show Details Button -->
    <ion-button (click)="toggleDetails()">
        {{ showDetails ? 'Hide Details' : 'Show Details' }}
    </ion-button>

    <!-- Details Section -->
    <div *ngIf="showDetails">
        <ion-list>
            <ion-item>
                <ion-label>Transactions</ion-label>
                <ion-icon *ngIf="syncList?.CheckTransactions == 'Success'"
                    [name]="syncList.CheckTransactions === 'Success' ? 'checkmark-circle' : ''"
                    [color]="syncList.CheckTransactions === 'Success' ? 'success' : 'circles'">
                </ion-icon>
                <ion-spinner name="circles" slot="end"
                    *ngIf="syncList?.CheckTransactions == 'InProgress'"></ion-spinner>
                <ion-button slot="end" fill="outline" (click)="retryTransactions()" class="margin-3px"
                    *ngIf="syncList.CheckTransactions=='Failed'">
                    <ion-icon slot="start" name="refresh"></ion-icon>
                    Retry
                </ion-button>
            </ion-item>
            <ion-item>
                <ion-label>Sessions</ion-label>
                <ion-spinner name="circles" slot="end" *ngIf="syncList?.CheckSessions == 'InProgress'"></ion-spinner>
                <ion-icon *ngIf="syncList?.CheckSessions == 'Success'"
                    [name]="syncList.CheckSessions === 'Success' ? 'checkmark-circle' : 'circles'"
                    [color]="syncList.CheckSessions === 'Success' ? 'success' : ''">
                </ion-icon>
            </ion-item>
            <ion-item *ngIf="hasSummarySales">
                <ion-label>Summary Sales</ion-label>
                <ion-spinner name="circles" slot="end"
                    *ngIf="syncList?.CheckSummarySales == 'InProgress'"></ion-spinner>
                <ion-icon *ngIf="syncList?.CheckSummarySales == 'Success'"
                    [name]="syncList.CheckSummarySales === 'Success' ? 'checkmark-circle' : 'circles'"
                    [color]="syncList.CheckSummarySales === 'Success' ? 'success' : 'danger'">
                </ion-icon>
            </ion-item>
        </ion-list>
        <ion-item *ngIf="!isAppOnline" lines="none">
            <ion-label>
                <div class="center_text_content">
                    <b>You are currently offline. Data cannot be sent right now. Please reconnect to the internet, or
                        re-open
                        POS after you are back online.</b>
                </div>
            </ion-label>
        </ion-item>
    </div>
</ion-content>

<ion-footer class="ion-padding ion-text-center">
    <ion-button color="success" (click)="dismiss()" [disabled]="progress < 100">Close</ion-button>
</ion-footer>
