<ion-header>
  <ion-toolbar>
    <ion-title large><span>Item - {{selItemName}}</span></ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-row>
    <ion-col size-sm="6">

      <ion-list>

        <ion-item>
          <ion-label static class="ion-float-left ion-margin-start" bold>Cost/Item</ion-label>
          <ion-label class="ion-float-right ion-text-right" text-bold custom-outline width-100
            *ngIf="showPaidPrice == false">
            {{selAmount}}
          </ion-label>
          <ion-label class="ion-float-right ion-text-right" text-bold custom-outline width-100
            *ngIf="showPaidPrice == true">
            {{selPaidAmount}}</ion-label>
        </ion-item>
        <ion-item>
          <ion-label static class="ion-float-left ion-margin-start" bold>Quantity</ion-label>
          <ion-label class="ion-float-right" text-right custom-outline-quantity width-100>{{selQuantity}}</ion-label>
          <!-- <input type="text" id="quantity" class="ion-text-right" custom-outline-quantity [(ngModel)]="selQuantity"
            style="width: -webkit-fill-available" appKeyDownEvent> -->
        </ion-item>
        <ion-item>
          <ion-label static class="ion-float-left ion-margin-start" bold>Extended Cost</ion-label>
          <ion-label class="ion-float-right ion-text-right" text-bold custom-outline width-100
            *ngIf="showPaidPrice == false">
            {{extendedCost}}</ion-label>
          <ion-label class="ion-float-right ion-text-right" text-bold custom-outline width-100
            *ngIf="showPaidPrice == true">
            {{extendedPaidCost}}</ion-label>
        </ion-item>

      </ion-list>
    </ion-col>
    <ion-col size-sm="6">

      <ion-digit-keyboard [align]="keyboardSettings.align" [width]="keyboardSettings.width"
        [visible]="keyboardSettings.visible" [leftActionOptions]="keyboardSettings.leftActionOptions"
        [rightActionOptions]="keyboardSettings.rightActionOptions" [roundButtons]="keyboardSettings.roundButtons"
        [showLetters]="keyboardSettings.showLetters" [swipeToHide]="keyboardSettings.swipeToHide"
        [theme]="keyboardSettings.theme" (buttonClick)="numberClick($event)">
      </ion-digit-keyboard>
    </ion-col>
  </ion-row>


</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-button size="large" fill="clear" color="black" (click)="close()">

      Cancel
    </ion-button>
    <ion-buttons slot="primary">
      <ion-button expand="block" size="large" color="slate" (click)="CompleteSelection()" [disabled]="actionComplete">
        Complete
        <ion-icon slot="end" name="arrow-forward-outline" class="color_green"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
