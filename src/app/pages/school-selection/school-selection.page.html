  <h1 class="ion-text-center" title>
    Choose a
    <br>
    <strong>Serving Location</strong>
  </h1>
</ion-header>
<ion-content bg-theme>
  <ion-row vh-100-dyn class="ion-justify-content-center" bg-theme>
    <ion-col size="12" size-md="10" size-xl="6" class="ion-align-self-baseline">
      <div box-list-white class="ion-margin-horizontal">
        <ion-list lines="none" class="ion-text-center">
            <ion-item mode="ios" class="no-line">
                <ion-searchbar class="ion-text-uppercase" autofocus #schoolSearch id="schoolSearch" (debounce)="500" type="text"
                (ionInput)="searchServingLocation($event)" placeholder="Search School..." [(ngModel)]="keyword"
                (ngModelChange)="keyword = $event.toLocaleUpperCase()">
                    <ion-button fill="clear" style="z-index: 99!important;" color="slate" *ngIf="isElectronApp"
                            class="ion-align-self-end eye-icon" (click)="openOnScreenKeyboard()">
                            <ion-icon slot="icon-only" name="keypad">
                            </ion-icon>
                    </ion-button>
                </ion-searchbar>
            </ion-item>
        </ion-list>
        <ion-list mode="ios" inset (click)="setActiveField('site')">
          <ion-radio-group>
            <ion-item mode="ios" *ngFor="let site of siteList; let i=index;"
              (click)="selectedSite = JSON.stringify(site)">
              <ion-label class="ion-text-uppercase" style="cursor:pointer">
                {{site.SiteNameWithCode}}
              </ion-label>
              <ion-radio color="slate" slot="end" id="{{site.SchoolId}}" [value]="JSON.stringify(site)">
              </ion-radio>
            </ion-item>
            <ion-item *ngIf="siteList.length == 0">
              <ion-label>No results found.</ion-label>
            </ion-item>
          </ion-radio-group>
        </ion-list>
      </div>
    </ion-col>
  </ion-row>
</ion-content>

<ion-footer class="ion-align-self-center" no-shadow>
  <ion-button color="slate" expand="block" size="large" fill="clear" (click)="setupSchoolData()">
    Proceed
    <ion-icon name="arrow-forward"></ion-icon>
  </ion-button>
  <!-- <ion-row class="ion-justify-content-center">

  </ion-row> -->
</ion-footer>
