<ion-content padding>
  <div class="ion-text-center">
    <p style="color: black; font-size: 2.5em;font-weight: bold;" class="ion-text-center">
      Unidentified Patron
    </p>
    <p style="color: red; font-size: 1.7em;font-weight: bold;">{{Message}}</p>
    <img style="border-radius: 0%;" src="assets/img/nopatronid.png">
  </div>
  <div>
    <ion-button style="padding-left: 20px; float: left;" color="medium" (click)="GotoLookup(false)">
      Lookup
    </ion-button>
    <ion-button style="float: right; padding-right: 20px;" color="medium" (click)="NextPatron(false)">
      Select Next
    </ion-button>
  </div>
</ion-content>
