<ion-content padding>
  <div class="ion-text-center">
    <p style="color: black; font-size: 2.3em;font-weight: bold;" class="ion-text-center">
      Unidentified Patron
    </p>
    <p style="color: red; font-size: 1.5em;font-weight: bold;">{{Message}}</p>
    <img style="border-radius: 0%;" src="assets/img/nopatronid.png">
  </div>
  <div>   
    <ion-button style="float: left; padding-left: 20px; height: 60px;" color="medium" (click)="NextPatron(false)">
      Continue Queue
    </ion-button>
    <ion-button style="padding-right: 20px; float: right; height: 60px;" color="mint" (click)="GotoLookup(false)">
      Lookup Patron
    </ion-button>
  </div>
</ion-content>
