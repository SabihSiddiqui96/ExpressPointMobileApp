
<button class="close" (click)="close()"><ion-icon name="close" slot="icon-only"></ion-icon></button>

<div style="text-align: center;padding:5rem 5rem 3rem 5rem;">
    <label style="padding:0.5rem;">Square Transaction in Progress ...</label><br /><br />
    <label style="font-size: 24px;font-weight: bold;">{{counter | formatTime}}</label>
    <ion-button (click)="cancelSquareTransaction()">Cancel Square Transaction</ion-button>
</div>
