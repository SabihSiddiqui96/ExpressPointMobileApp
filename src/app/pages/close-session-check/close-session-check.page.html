<ion-header>
  <ion-toolbar>
    <ion-title>
      Checks
    </ion-title>
  </ion-toolbar>
  <ion-toolbar class="ion-no-padding" *ngIf="!hideChecks">
    <ion-row addbar padding class="ion-align-items-center ion-padding">
      <ion-input type="text" placeholder="Check Number" maxlength="10" [(ngModel)]="checkNumber" input-outline>
      </ion-input>
      <ion-input type="text" placeholder="Check Amount" (keyup)="numberOnly($event)" maxlength="8"
        [(ngModel)]="checkAmount" input-outline></ion-input>
      <ion-button fill="clear" (click)="addCheck()">
        <ion-icon slot="icon-only" name="add-circle" color="secondary"></ion-icon>
      </ion-button>
    </ion-row>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div custom-list>
    <ion-row header-row>
      <ion-col size="3">
        <ion-label>Check #</ion-label>
      </ion-col>
      <ion-col size="3">
        <ion-label>Amount</ion-label>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let check of checkList; let i=index;" class="ion-align-items-center">
      <ion-col size="3">
        <ion-label *ngIf="!check.IsDeleted">{{check.CheckNumber}}</ion-label>
      </ion-col>
      <ion-col size="3">
        <ion-label *ngIf="!check.IsDeleted">{{check.Amount | currency:'USD':'symbol':'1.2-2'}}</ion-label>
      </ion-col>
      <ion-col size="2">
        <ion-button *ngIf="!check.IsDeleted && !hideChecks" expand="block" fill="clear" (click)="removeCheck(i)">
          <ion-icon slot="icon-only" name="close-circle" color="danger"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-title *ngIf="checkList.length !=0">
      {{checkList.length}} checks totaling {{checkTotal | currency:'USD':'symbol':'1.2-2'}}
    </ion-title>
    <ion-buttons slot="primary">
      <ion-button size="large" expand="block" fill="clear" color="secondary" (click)="dismiss()">
        Close

      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
