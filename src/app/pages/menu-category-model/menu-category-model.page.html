<!--
  Generated template for the MenuCategoryModel page.

  See http://ionicframework.com/docs/v2/components/#navigation for more info on
  Ionic pages and navigation.
-->

<ion-header>
  <ion-toolbar>
    <ion-title>
      <ion-grid *ngIf="navSubMenuGridName != 'All Categories'">
        <ion-row class="bg-transparent no-line" class="ion-align-items-center">
          <ion-col size="3" size-md="3" size-sm="3">
            <!-- <ion-label slot="start"> -->
            <ion-button fill="clear" color="slate" (click)="blurInputElement(); back()" class="ion-align-self-start">
              <ion-icon name="arrow-back"></ion-icon>
              All Categories
            </ion-button>
            <!-- </ion-label> -->
          </ion-col>
          <ion-col size="6" size-md="6" size-sm="6">
            <ion-label>{{navSubMenuGridName}}</ion-label>
          </ion-col>
          <!-- <ion-col size="7" size-md="7" size-sm="7">
            <ion-label class="ion-text-left">{{navSubMenuGridName}}</ion-label>
          </ion-col> -->
        </ion-row>
      </ion-grid>
      <ion-grid *ngIf="!navFromClassroomSale && (navSubMenuGridName == 'All Categories')">
        <ion-row bold class="bg-transparent no-line ion-align-items-center">
          <ion-col size="2" size-md="2" size-sm="2"></ion-col>
          <ion-col size="4" size-md="4" size-sm="4">
            <ion-item lines="none" class="bg-transparent">
              <ion-label bold class="ion-text-center">{{navSubMenuGridName}}</ion-label>
            </ion-item>
          </ion-col>
          <ion-col size="6" size-md="6" size-sm="6">
            <ion-item lines="none" class="bg-transparent" style="padding-top: 4px;">
              <ion-label class="ion-text-right" position="bottom">Remain Open</ion-label>
              <ion-toggle slot="end" class="ion-float-left" color="slate" [(ngModel)]="remainOpen"
                (ionChange)="blurInputElement(); setRemainOpen($event)">
              </ion-toggle>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
      <ion-grid *ngIf="navFromClassroomSale && (navSubMenuGridName == 'All Categories')">
        <ion-row lines="none" bold class="bg-transparent">
          <ion-col>
            <ion-label bold class="ion-padding-start ion-text-center">{{navSubMenuGridName}}</ion-label>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="navSubmenuGrid.length>0">

  <ion-row *ngFor="let sub_array of navSubmenuGrid; let i =index">
    <ion-col *ngFor="let subgrid of sub_array;let j=index;">
      <div class="menu-item-category menu-button" *ngIf="subgrid.isCategory==true">
        <ion-button expand="block" [style.border]="'1px solid ' + subgrid.BackColor"
          (click)="blurInputElement(); showCategoryItems(subgrid)">
          {{subgrid.ButtonDescription}} <span *ngIf = 'subgrid.IsDynamicMenu==true'> (D)</span>
          <ion-icon slot="end" name="alert" [style.display]="subgrid.restrictedItem==true? '' : 'none'">
          </ion-icon>
        </ion-button>
      </div>
      <div class="menu-item-dynamic menu-button" *ngIf="subgrid.isCategory==false || subgrid.isCategory==undefined">
        <ion-button expand="block" *ngIf="subgrid.isCategory!=true" [style.backgroundColor]="subgrid.BackColor"
          [style.color]="subgrid.ForeColor"
          [style.borderColor]="subgrid.RefId == navDefaultMenuItemId ? 'transparent' : subgrid.BackColor"
          (click)="blurInputElement(); addMenuToCart(subgrid)">
          {{subgrid.ButtonDescription}}&ensp;
          <ion-icon slot="end" name="alert" [style.display]="subgrid.restrictedItem==true? '' : 'none'"></ion-icon>
          <ion-icon slot="end" name="restaurant" [style.display]="subgrid.IsReimbursable== true? '' : 'none'">
          </ion-icon>
        </ion-button>
      </div>
    </ion-col>
  </ion-row>

</ion-content>

<ion-footer class="ion-text-center">
  <ion-toolbar class="ion-align-items-center" position="bottom">
    <ion-button expand="block" size="large" fill="clear" color="slate" (click)="blurInputElement(); close()">
      Close
    </ion-button>
  </ion-toolbar>
</ion-footer>
