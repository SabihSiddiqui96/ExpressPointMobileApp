<ion-header bg-theme no-shadow>
    <ion-buttons>
        <ion-menu-toggle>
            <ion-button fill="clear" color="slate">
                <ion-icon slot="icon-only" name="menu"></ion-icon>
            </ion-button>
        </ion-menu-toggle>
    </ion-buttons>
</ion-header>
<ion-content bg-theme>
    <ion-row vh-100-dyn class="ion-justify-content-center" bg-theme>
        <ion-col size="12" size-md="8" size-xl="4" class="ion-align-self-center">
            <div box-list-white class="ion-margin-horizontal">
                <h1 class="ion-text-center" title>
                    Serving Options for
                    <br>
                    <strong class="ion-text-uppercase">{{displayDetails.site_name}}</strong>
                    <br>{{deviceInfo?.TerminalName}}
                </h1>
                <ion-list mode="ios" inset>
                    <ion-item option-open-session mode="ios" *ngIf="!openSession"
                        (click)="checkOpenSession('MenuService')" detail>
                        <ion-icon slot="start" color="slate" name="restaurant"></ion-icon>
                        <ion-label text-large>Open Service</ion-label>
                    </ion-item>
                    <ion-item option-continue-session mode="ios" *ngIf="openSession"
                        (click)="checkOpenSession('MenuService')" detail>
                        <ion-icon slot="start" color="slate" name="restaurant"></ion-icon>
                        <ion-label text-large>Continue Service</ion-label>
                    </ion-item>
                    <ion-item option-close-session mode="ios" *ngIf="openSession" (click)="goCloseSession()" detail>
                        <ion-icon slot="start" color="slate" name="checkbox-outline"></ion-icon>
                        <ion-label text-large>Close Service</ion-label>
                    </ion-item>
                    <ion-item option-transactions mode="ios" (click)="checkOpenSession('Transactions')" detail>
                        <ion-icon slot="start" color="slate" name="newspaper-outline"></ion-icon>
                        <ion-label text-large>Transactions</ion-label>
                        <!--<ion-badge slot="end" color="slate">475</ion-badge>-->
                    </ion-item>
                    <ion-item option-quick-sales mode="ios" *ngIf="permissions.CanDoClassroomSale"
                        (click)="checkOpenSession('ClassroomSale')" detail>

                        <ion-icon slot="start" color="slate" name="people"></ion-icon>
                        <ion-label text-large>Bulk Sales</ion-label>
                    </ion-item>
                    <ion-item option-quick-sales mode="ios" *ngIf="canSumSale" (click)="checkOpenSession('SummarySale')"
                        detail>
                        <ion-icon slot="start" color="slate" name="clipboard-outline"></ion-icon>
                        <ion-label text-large>Summary Sale</ion-label>
                    </ion-item>
                    <ion-item option-orders mode="ios" *ngIf="ORDMEALS" (click)="checkOpenSession('PreOrders')" detail>
                        <ion-icon slot="start" color="slate" name="file-tray-full"></ion-icon>
                        <ion-label text-large>Orders</ion-label>
                    </ion-item>
                    <ion-item option-payments mode="ios" *ngIf="permissions.CanDoPayments && !hidePaymentOptions"
                        (click)="checkOpenSession('Payments')" detail>
                        <ion-icon slot="start" color="slate" name="cash"></ion-icon>
                        <ion-label text-large>Payments</ion-label>
                    </ion-item>
                    <ion-item option-transactions mode="ios" (click)="checkOpenSession('DeviceConfiguration')" detail>
                        <ion-icon slot="start" color="slate" name="help-buoy"></ion-icon>
                        <ion-label text-large>Device Information</ion-label>
                        <!--<ion-badge slot="end" color="slate">475</ion-badge>-->
                    </ion-item>
                    <!--<ion-button option-notifications mode="ios" ion-item *ngIf="settings.CanDoClassroomSale" (click)="checkOpenSession('ClassroomSale')">
                      <ion-icon slot="start" color="slate" name="notifications"></ion-icon>
                      <ion-label text-large>Notifications</ion-label>
                      <ion-badge slot="end" color="slate">3</ion-badge>
                    </ion-button>-->
                </ion-list>
            </div>
        </ion-col>
    </ion-row>
</ion-content>
