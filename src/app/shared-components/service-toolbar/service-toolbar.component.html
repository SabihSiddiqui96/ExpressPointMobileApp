<ion-header>
    <ion-toolbar color="slate">
        <ion-row style="align-items: center ">

            <!-- Menu Button -->
            <ion-col size="1">
                <ion-menu-toggle>
                    <ion-button class="btn-full-size-icon" fill="clear" [ngClass]="{'ion-hide':swapRight}" push-md="4">
                        <ion-icon slot="icon-only" name="menu">
                        </ion-icon>
                    </ion-button>
                </ion-menu-toggle>
            </ion-col>

            <!-- Day of week -->
            <ion-col size="2">
                <ion-button default expand="block" 
                    [disabled]="servingLines.length > 0 && showDynamicEntreeServingLine == true && disableDynamicEntreeServingLine == false" 
                    (click)="blurInputElement();showDayOfWeekPopup()">
                    <span>{{days[dayOfWeek].label}}</span>
                </ion-button>
            </ion-col>

            <!-- Meal Type -->
            <ion-col size="2">
                <ion-button default expand="block" (click)="blurInputElement();showMealTypePopup()">
                    <span *ngIf="selectedMealType != -1">{{selectedMealTypeName}}</span>
                    <span *ngIf="selectedMealType == -1">Meal
                        Type</span>
                </ion-button>
            </ion-col>

            <!-- Menu Type -->
            <ion-col [size]="settingAutoServe ? showDynamicEntreeServingLine == true ? '2' : '3' : showDynamicEntreeServingLine == true ? '4' : '5'">
                <ion-button default expand="block" (click)="blurInputElement();showMenuTypePopup()">
                    <span *ngIf="selectedMenuType != -1">{{selectedMenuTypeName}}</span>
                    <span *ngIf="selectedMenuType == -1">Menu</span>
                </ion-button>
            </ion-col>
            <ion-col size="1" *ngIf="showDynamicEntreeServingLine == true">
                <ion-button class="btn-full-size-icon" [title]="'Serving Line - ' + selectedServingLineName" default expand="block" fill="clear" 
                     [disabled]="disableDynamicEntreeServingLine" 
                     (click)="blurInputElement();showServingLinesPopup()">
                    <ion-icon slot="icon-only" name="restaurant"></ion-icon>
                </ion-button>
            </ion-col>

            <!-- Categories -->
            <ion-col size="1">
                <ion-button class="btn-full-size-icon" default expand="block" fill="clear"
                    (click)="blurInputElement();showAllCategories()">
                    <ion-icon slot="icon-only" name="apps"></ion-icon>
                </ion-button>
            </ion-col>

            <!-- Transaction viewer -->
            <ion-col size="1">
                <ion-button class="btn-full-size-icon" expand="block" (click)="blurInputElement();openTransactionViewer()">
                    <ion-icon slot="icon-only" name="newspaper-outline">
                    </ion-icon>
                </ion-button>
            </ion-col>
            <!-- Auto Serve -->
            <ion-col [size]="settingAutoServe ? '2' : '0'" *ngIf="settingAutoServe" [ngClass]="impermanentAutoServePause ? 'blinkAutoServe' : ''">
                <ion-button [ngClass]="autoServeEnabled ? 'autoServeOn' : 'autoServeOFF'" class="btn-full-size-icon" expand="block"
                    (click)="blurInputElement();swapAutoServeEnabled()">
                    <img style="margin-right: 0px;" slot="start" src="assets/img/autoserve.png">
                    <span>AutoServe {{autoServeEnabled ? (impermanentAutoServePause ? "PAUSE" :"ON") : "OFF"}}</span>
                </ion-button>
            </ion-col>
        </ion-row>
    </ion-toolbar>
</ion-header>
